<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Luminous Breathing Tree</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d4af37;
            font-size: 14px;
            letter-spacing: 1px;
            transition: opacity 0.4s;
        }
        
        /* --- 导航按钮容器 --- */
        .nav-box {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column; /* 手机上垂直排列 */
            gap: 15px; /* 按钮之间的间距 */
            z-index: 100;
            align-items: center;
            width: 100%;
        }

        /* --- 按钮样式 --- */
        .wall-btn {
            position: relative; /* 改为相对定位 */
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 14px;
            font-family: -apple-system, sans-serif;
            letter-spacing: 3px;
            background: rgba(0, 0, 0, 0.6);
            transition: all 0.5s ease;
            backdrop-filter: blur(2px);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .wall-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
            color: #fff;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4), inset 0 0 10px rgba(212, 175, 55, 0.2);
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.8);
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <div id="loading">IGNITING LIGHTS...</div>
    
    <div class="nav-box">
        <a href="photo_wall.html" class="wall-btn">✨ Enter Memory Wall ✨</a>
        <a href="sudoku.html" class="wall-btn">🍭 Play Sweet Sudoku 🍭</a>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // --- 1. 照片配置 (保持不变) ---
        const photoUrls = [
            'https://ickd11.github.io/lyx_2025/imgs/3.jpg',
            'https://ickd11.github.io/lyx_2025/imgs/8.jpg',
            'https://ickd11.github.io/lyx_2025/imgs/12.jpg',
            'https://ickd11.github.io/lyx_2025/imgs/21.jpg',
            'https://ickd11.github.io/lyx_2025/imgs/18.jpg',
            'https://ickd11.github.io/lyx_2025/imgs/26.jpg',
            'https://ickd11.github.io/lyx_2025/imgs/29.jpg',
            'https://ickd11.github.io/lyx_2025/imgs/32.jpg',
            'https://ickd11.github.io/lyx_2025/imgs/33.jpg',
            'https://ickd11.github.io/lyx_2025/imgs/34.png',
        ];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');

        let width, height, dpr;
        let particles = [];
        let photoObjects = [];
        let loadedImages = [];
        
        let rotateY = 0;
        let rotateX = -0.1; 
        
        let velY = 0.005; 
        let velX = 0;
        let isDragging = false;
        let lastX, lastY;
        let selectedPhoto = null;
        let bgDarkness = 0; 

        const FOV = 400; 

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // --- 2. 资源加载 ---
        function preloadImages(urls, cb) {
            let count = 0;
            if(urls.length === 0) return cb();
            urls.forEach((url, i) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = img.onerror = () => {
                    count++;
                    if(count === urls.length) {
                        loadingEl.style.opacity = 0;
                        setTimeout(()=>{loadingEl.style.display='none'; cb();}, 400);
                    }
                };
                img.src = url;
                loadedImages[i] = img;
            });
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 3. 3D 核心 ---
        function project3D(x, y, z) {
            const scale = FOV / (FOV + z);
            const x2d = x * scale + width/2;
            const y2d = y * scale + height/2;
            return { x: x2d, y: y2d, s: scale, z: z };
        }

        function rotate(x, y, z, ax, ay) {
            const cosX = Math.cos(ax), sinX = Math.sin(ax);
            const y1 = y*cosX - z*sinX;
            const z1 = z*cosX + y*sinX;
            const cosY = Math.cos(ay), sinY = Math.sin(ay);
            const x2 = x*cosY - z1*sinY;
            const z2 = z1*cosY + x*sinY;
            return { x: x2, y: y1, z: z2 };
        }

        // --- 4. 粒子系统 ---
        class Particle {
            constructor(type) {
                this.type = type; 
                this.reset();
            }
            reset() {
                if (this.type === 'star') {
                    this.x = 0; this.y = -260; this.z = 0;
                    this.size = 16; return;
                }
                this.y = (Math.random() * 520) - 260; 
                const progress = (this.y + 260) / 520; 
                const maxR = 210 * progress; 
                const r = Math.sqrt(Math.random()) * maxR; 
                const angle = Math.random() * Math.PI * 2;
                this.x = Math.cos(angle) * r;
                this.z = Math.sin(angle) * r;
                
                this.blinkOffset = Math.random() * 100; 

                if (this.type === 'light') {
                    this.color = Math.random()>0.5 ? '#FFD700' : '#FF4500'; 
                    this.size = Math.random() * 2.5 + 1.5;
                } else {
                    const g = Math.floor(100 + Math.random()*155); 
                    const b = Math.floor(50 + Math.random()*100);  
                    this.color = `rgb(40, ${g}, ${b})`; 
                    this.size = Math.random() * 2 + 0.8;
                }
            }
            
            draw(p2d) {
                if(p2d.z < -FOV+10 || p2d.s <= 0) return;
                const s = this.size * p2d.s;
                
                if (this.type === 'star') {
                    ctx.save();
                    ctx.translate(p2d.x, p2d.y);
                    ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 30; 
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    for(let i=0; i<5; i++){
                        ctx.lineTo(Math.cos((18+i*72)/180*Math.PI)*s*1.5, -Math.sin((18+i*72)/180*Math.PI)*s*1.5);
                        ctx.lineTo(Math.cos((54+i*72)/180*Math.PI)*s*0.6, -Math.sin((54+i*72)/180*Math.PI)*s*0.6);
                    }
                    ctx.fill();
                    ctx.restore();
                } else {
                    let brightness = Math.sin(Date.now() * 0.003 + this.blinkOffset) * 0.3 + 0.7;
                    if (this.type === 'light') {
                        brightness = Math.sin(Date.now() * 0.006 + this.blinkOffset) * 0.5 + 0.5;
                        ctx.shadowBlur = 10 * p2d.s * brightness; 
                        ctx.shadowColor = this.color;
                    }
                    ctx.globalAlpha = brightness * Math.max(0.1, 1 - bgDarkness * 0.9);
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(p2d.x, p2d.y, s, 0, Math.PI*2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }
            }
        }

        // --- 5. 照片卡片 ---
        class PhotoCard {
            constructor(img, idx, total) {
                this.img = img;
                const hRange = 400;
                this.baseY = -200 + (idx / (total-0.99)) * hRange;
                const r = 210 * ((this.baseY + 260) / 520) + 25; 
                const angle = idx * 2.4; 
                this.baseX = Math.cos(angle) * r;
                this.baseZ = Math.sin(angle) * r;
                
                this.isSelected = false;
                this.animProgress = 0;
                this.currX = this.baseX; this.currY = this.baseY; this.currZ = this.baseZ;
                this.currSize = 50; this.currRotY = 0;
            }
            
            update() {
                const targetProgress = this.isSelected ? 1 : 0;
                this.animProgress += (targetProgress - this.animProgress) * 0.08;
                if (Math.abs(targetProgress - this.animProgress) < 0.001) this.animProgress = targetProgress;
                
                const t = easeInOutCubic(this.animProgress);

                if (this.isSelected || this.animProgress > 0.01) {
                    const treePos = rotate(this.baseX, this.baseY, this.baseZ, rotateX, rotateY);
                    this.currX = treePos.x * (1-t) + 0 * t;
                    this.currY = treePos.y * (1-t) + 0 * t;
                    this.currZ = treePos.z * (1-t) + (-FOV + 150) * t;
                    this.currSize = 50 * (1-t) + 220 * t;
                    this.currRotY = t * Math.PI * 2; 
                    
                    if (this.isSelected && t > 0.95) {
                        this.currY += Math.sin(Date.now() * 0.002) * 5;
                        this.currRotY += Math.sin(Date.now() * 0.0015) * 0.05;
                    }
                } else {
                    const p3d = rotate(this.baseX, this.baseY, this.baseZ, rotateX, rotateY);
                    this.currX = p3d.x; this.currY = p3d.y; this.currZ = p3d.z;
                    this.currSize = 50; this.currRotY = 0;
                }
            }
            
            draw(p2d) {
                if (!this.img.complete || p2d.s <= 0) return;
                if (this.currZ < -FOV + 20 && !this.isSelected && this.animProgress < 0.1) return;

                const s = this.currSize * p2d.s;
                ctx.save();
                ctx.translate(p2d.x, p2d.y);
                ctx.rotate(this.currRotY);
                
                const pad = (this.isSelected || this.animProgress > 0.5) ? 10*p2d.s : 4*p2d.s;
                if (this.animProgress > 0.1) {
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowBlur = 30 * this.animProgress;
                    ctx.shadowOffsetY = 10 * this.animProgress;
                }

                ctx.fillStyle = '#fff';
                const r = 4;
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(-s/2-pad, -s/2-pad, s+pad*2, s+pad*2, r);
                else ctx.fillRect(-s/2-pad, -s/2-pad, s+pad*2, s+pad*2);
                ctx.fill();
                
                ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
                const min = Math.min(this.img.width, this.img.height);
                ctx.drawImage(this.img, (this.img.width-min)/2, (this.img.height-min)/2, min, min, -s/2, -s/2, s, s);
                
                if (this.animProgress < 0.5) {
                    ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(0, -s/2-pad); ctx.lineTo(0, -s/2-pad-10*p2d.s); ctx.stroke();
                }
                ctx.restore();
                this.hitArea = { x: p2d.x, y: p2d.y, r: s/2 + pad };
            }
        }

        // --- 6. 主逻辑 ---
        function init() {
            for(let i=0; i<2000; i++) particles.push(new Particle('tree'));
            for(let i=0; i<250; i++) particles.push(new Particle('light'));
            particles.push(new Particle('star'));
            
            loadedImages.forEach((img, i) => {
                photoObjects.push(new PhotoCard(img, i, loadedImages.length));
            });
            animate();
        }

        let touchStartX, touchStartY;
        function handleStart(x, y) {
             isDragging = true; lastX=x; lastY=y; velX=0; velY=0;
             touchStartX = x; touchStartY = y;
        }
        function handleMove(x, y) {
            if(isDragging && !selectedPhoto) {
                const dx = x - lastX; const dy = y - lastY;
                rotateY += dx*0.005; rotateX += dy*0.005;
                velY = dx*0.005; velX = dy*0.005; 
                lastX=x; lastY=y;
            }
        }
        function handleEnd(x, y) {
            isDragging = false;
            if (Math.abs(x - touchStartX) < 5 && Math.abs(y - touchStartY) < 5) handleClick(x, y);
        }
        
        function handleClick(x, y) {
            let hit = null;
            for (let i=photoObjects.length-1; i>=0; i--) {
                const p = photoObjects[i];
                if (selectedPhoto && p === selectedPhoto) { hit = p; break; }
                if(p.hitArea && p.currZ > -200) { 
                    const d = Math.sqrt((x-p.hitArea.x)**2 + (y-p.hitArea.y)**2);
                    if (d < p.hitArea.r * 1.2) { hit = p; break; }
                }
            }
            if(hit) {
                if(selectedPhoto === hit) { selectedPhoto.isSelected = false; selectedPhoto = null; }
                else { if(selectedPhoto) selectedPhoto.isSelected = false; selectedPhoto = hit; selectedPhoto.isSelected = true; }
            } else if (selectedPhoto) { selectedPhoto.isSelected = false; selectedPhoto = null; }
        }

        canvas.addEventListener('touchstart', e=>{ e.preventDefault(); handleStart(e.touches[0].clientX, e.touches[0].clientY)}, {passive:false});
        canvas.addEventListener('touchmove', e=>{ e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY)}, {passive:false});
        canvas.addEventListener('touchend', e=>{ handleEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY)});
        canvas.addEventListener('mousedown', e=>handleStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', e=>handleMove(e.clientX, e.clientY));
        canvas.addEventListener('mouseup', e=>handleEnd(e.clientX, e.clientY));

        function animate() {
            if(!isDragging && !selectedPhoto) {
                rotateY += velY; rotateX += velX;
                velY *= 0.98; 
                velX *= 0.98;
                if(Math.abs(velY) < 0.002) velY = 0.002; 
            }

            ctx.fillStyle = '#000000';
            ctx.fillRect(0,0, width, height);

            const targetDark = selectedPhoto ? 1 : 0;
            bgDarkness += (targetDark - bgDarkness) * 0.1;
            
            let renderList = [];

            particles.forEach(p => {
                const p3d = rotate(p.x, p.y, p.z, rotateX, rotateY);
                renderList.push({type:'p', z:p3d.z, obj:p, p3d:p3d});
            });

            photoObjects.forEach(p => {
                p.update();
                renderList.push({type:'photo', z:p.currZ, obj:p});
            });

            renderList.sort((a,b) => b.z - a.z);

            renderList.forEach(item => {
                if(item.type === 'p') {
                    const p2d = project3D(item.p3d.x, item.p3d.y, item.p3d.z);
                    item.obj.draw(p2d);
                } else {
                    const p2d = project3D(item.obj.currX, item.obj.currY, item.obj.currZ);
                    item.obj.draw(p2d);
                }
            });

            requestAnimationFrame(animate);
        }

        preloadImages(photoUrls, init);
    </script>
</body>
</html>
